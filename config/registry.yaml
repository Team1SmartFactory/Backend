# 로봇/라인 레지스트리 (DEVELOPMENT_ROADMAP.md 3장, COMMAND_SCHEMA.md 2장 기준)
#
# 실기/시뮬 전환은 이 파일의 simulated 값만 바꾸면 된다 — 코드 수정 없음.
# layout.bounds: TELEMETRY(x,y 미터) -> 프론트 좌표(0~100 상대값) 변환에 쓰이는
# 평면도 전체 크기. 물리 레이아웃 확정 전까지는 임시값 (API_LIST.md 12.3 관련 결정 참고).
#
# lineId는 프론트 평면도(T1FE/dashboard-frontend/src/features/floorplan/floorPlanLayout.ts)의
# FLOOR_ZONES와 1:1로 맞춘다 (이슈 #29 — "백엔드를 프론트에 맞춘다" 결정). line-a~f의
# position(x/y)은 그 파일의 zone.rect 중심을 0~100 상대좌표로 환산한 값 (VIEW 1560x1010 기준).
# 프론트 도면이 바뀌면 이 값들도 같이 갱신할 것 — 반대로 여기 lineId를 프론트와
# 무관하게 바꾸면 평면도 클릭이 다시 무반응이 된다.

layout:
  bounds:
    width: 40.0
    height: 25.0

lines:
  - lineId: line-a
    name: "A라인"
    # 아래 partId/capacity/thresholdRatio는 bins 도입 이전과의 호환용 대표값
    # (Line.status/currentQty는 실제로는 bins 롤업으로 계산된다 — 이슈 #37).
    partId: P-001
    capacity: 50
    thresholdRatio: 0.05
    x: 19.6
    y: 29.5
    simulated: false # 실기
    # 실물 로봇팔(omxf-line-01, station_b)이 닿을 수 있는 칸 4개 — 각 칸에 서로
    # 다른 부품이 적재된다. label은 Hardware topic_map.py의 PART_TO_BIN이 참조하는
    # 물리 칸 이름(bin_a~d)과 맞춰야 한다.
    bins:
      - binId: line-a-bin-a
        label: a
        partId: P-101
        partName: "M6 볼트 세트"
        capacity: 50
        thresholdRatio: 0.05
      - binId: line-a-bin-b
        label: b
        partId: P-102
        partName: "M8 너트 세트"
        capacity: 50
        thresholdRatio: 0.05
      - binId: line-a-bin-c
        label: c
        partId: P-103
        partName: "베어링 6202"
        capacity: 50
        thresholdRatio: 0.05
      - binId: line-a-bin-d
        label: d
        partId: P-104
        partName: "스프링 와셔 세트"
        capacity: 50
        thresholdRatio: 0.05
  - lineId: line-b
    name: "B라인"
    partId: P-002
    capacity: 50
    thresholdRatio: 0.05
    x: 49.5
    y: 29.5
    simulated: true # 시뮬
  - lineId: line-c
    name: "C라인"
    partId: P-003
    capacity: 50
    thresholdRatio: 0.05
    x: 77.9
    y: 29.5
    simulated: true # 시뮬
  - lineId: line-d
    name: "D라인"
    partId: P-004
    capacity: 50
    thresholdRatio: 0.05
    x: 19.6
    y: 62.7
    simulated: true # 시뮬
  - lineId: line-e
    name: "E라인"
    partId: P-005
    capacity: 50
    thresholdRatio: 0.05
    x: 49.5
    y: 62.7
    simulated: true # 시뮬
  - lineId: line-f
    name: "F라인"
    partId: P-006
    capacity: 50
    thresholdRatio: 0.05
    x: 77.9
    y: 62.7
    simulated: true # 시뮬

